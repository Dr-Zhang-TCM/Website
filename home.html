<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="static/DrZLogo.png">
    <script src="script.js" defer></script>
    <title>DrZ-TCM Home Page</title>
</head>
<body>
    <header>
        <div class="header-left">Dr. Zhang TCM Home Page</div>
        <nav>
            <ul>
                <li><a href="/home">Home</a></li>
                <li><a href="/about">About Us</a></li>
                <li><a href="/services">Services</a></li>
                <li><a href="/contact">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="homecontainer">
        <section class="carousel" aria-label="Clinic gallery">
            <div class="carousel__track">
                <figure class="carousel__slide"><img src="static/clinic1.jpg" alt="Acupuncture treatment in progress"></figure>
                <figure class="carousel__slide"><img src="static/clinic2.jpg" alt="Our treatment room"></figure>
                <figure class="carousel__slide"><img src="static/clinic3.jpg" alt="Herbal medicine"></figure>
            </div>
            <button class="carousel__btn carousel__btn--prev" aria-label="Previous image">&#10094;</button>
            <button class="carousel__btn carousel__btn--next" aria-label="Next image">&#10095;</button>
            <div class="carousel__dots"></div>
        </section>
    </main>

</body>
</html>
